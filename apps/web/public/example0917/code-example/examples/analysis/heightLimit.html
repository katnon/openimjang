<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고도제한 분석</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <link href="/static/css/app.css" rel="stylesheet">
    <script src="/lib/js/cesium/Cesium.js"></script>
    <link href="/lib/js/cesium/Widgets/widgets.css" rel="stylesheet">
    <script defer src="/lib/js/mapprime.cesium-controls.min.js"></script>
    <script defer src="/static/js/main.js"></script>
</head>

<body>
    <div class="buttons-wrap">
        <label>고도제한 <input type="text" id="height" value="50">m</label>
        <button class="draw-button" data-type="2">
            영역 그리기
        </button>
    </div>
    <div id="resultTable"></div>
    <div class="buttons-wrap-bottom">
        <button id="draw-stop-button">
            영역 그리기 종료
        </button>
        <button id="draw-cancel-button" class="gray">
            그리기취소 X
        </button>
    </div>
    <div id="helper">
        지도를 클릭하여 원하는 영역을 그려주세요.(그리기종료: 마우스 우클릭, esc키)
    </div>
    <div id="world-container"></div>
    <script>
        //그리기 버튼
        const drawBtns = document.querySelectorAll('.draw-button');
        //그리기 종료 버튼
        const drawStopBtn = document.getElementById('draw-stop-button');
        //그리기 취소 버튼
        const drawCancelBtn = document.getElementById('draw-cancel-button');
        //하단 버튼 그룹
        const bottomBtns = document.querySelector('.buttons-wrap-bottom');
        //도움말
        const helper = document.getElementById('helper');
        //그리기 버튼 이벤트: 클릭시 도형 그리기 시작
        drawBtns.forEach((btn) => btn.addEventListener('click', (e) => {
                // ESC 키 이벤트 등록
                document.addEventListener('keydown', handleKeyDown);
                const shapeType = Number(e.currentTarget.dataset.type);
                helper.style.display = 'block';
                // ESC 키 이벤트 등록
                document.addEventListener('keydown', handleKeyDown);
                //종료버튼 보기
                bottomBtns.style.display = 'flex';
                //도형 그리기
                viewer._drawAction({
                    shapeType: shapeType, //0:포인트, 1:라인, 2:폴리곤
                    showLabel: true, //라벨표출
                    stopDrawElement: drawStopBtn //종료버튼 지정
                }).then((res) => {
                    // ESC 이벤트 핸들러 제거
                    document.removeEventListener('keydown', handleKeyDown);
                    //도움말 종료버튼 숨기기
                    helper.style.display = 'none';
                    bottomBtns.style.display = 'none';
                    
                    const height = Number(document.getElementById('height').value);
                    viewer._createPolygon({
                        positions: res.data.positions,
                        applyTo: 0,
                        material: Cesium.Color.DARKGOLDENROD.withAlpha(.5)
                    });
                    viewer._createPolygon({
                        positions: res.data.positions.map(p => {
                            const carto = Cesium.Cartographic.fromCartesian(p);
                            carto.height = 10000;
                            return Cesium.Cartographic.toCartesian(carto);
                        }),
                        clampToGround: false,
                        height: height,
                        material: new Cesium.GridMaterialProperty({
                            color: Cesium.Color.RED.withAlpha(0.9), 
                            cellAlpha: 0.2,
                            lineCount: new Cesium.Cartesian2(20, 20), 
                            lineThickness: new Cesium.Cartesian2(1, 1)
                        }),
                        perPositionHeight: false,
                        outline: true,
                        outlineColor: Cesium.Color.RED
                    });
                    //서버 설정
                    MapPrime3DExtension.SERVER.url = "https://mapprime.synology.me:15289/wind-svr";
                    viewer._startAnalysisHeightLimit({
                        positions: res.data.positions,
                        height: height,
                        heightLimitedColor: '#0000ff'
                    }).then((heightLimit)=>{
                        window.zoomTo = (filename) => {
                            heightLimit.forEach(r=>r.building.color = Cesium.Color.WHITE);
                            const target = heightLimit.find(r=>r.properties.filename === filename);
                            target.building.color = Cesium.Color.YELLOW;
                            let [west, south, east, north] = target.properties.bbox;
                            const padding = 0.0005;
                            west -= padding;
                            south -= padding;
                            east += padding;
                            north += padding;
                            viewer.camera.flyTo({
                                destination: Cesium.Rectangle.fromDegrees(west, south, east, north)
                            });
                        }
                        let innerHTML='';
                        heightLimit.forEach(r=>innerHTML+=`<li onclick="zoomTo('${r.properties.filename}')"><span>${r.properties.filename}</span><span>절대고도: ${r.properties.maxZ.toFixed(2)}m</span><span>건물높이: ${r.properties.height.toFixed(2)}m</span><span>초과고도: ${(r.properties.maxZ-height).toFixed(2)}m</span></li>`);
                        document.getElementById('resultTable').innerHTML = `<div>초과건물수 ${heightLimit.length}개</div><ul>${innerHTML}</ul>`;
                    });
                }).catch((err) => {
                    console.error(err);
                    // 예외 발생 시도 ESC 이벤트 핸들러 제거
                    document.removeEventListener('keydown', handleKeyDown);
                    helper.style.display = 'none';
                    bottomBtns.style.display = 'none';
                });
            }));

        // ESC 키 처리용 이벤트 핸들러
        function handleKeyDown(event) {
            if (event.key === 'Escape') {
                // 그리기 취소 함수 호출
                viewer._cancelDrawAction();
                // 도움말 및 종료버튼 숨기기
                document.getElementById('helper').style.display = 'none';
                bottomBtns.style.display = 'none';
                // ESC 이벤트 핸들러 제거 (그리기 중에만 유효)
                document.removeEventListener('keydown', handleKeyDown);
            }
        }
        //그리기취소 버튼 이벤트 핸들러
        drawCancelBtn.addEventListener('click', () => {
            viewer._cancelDrawAction();
            helper.style.display = 'none';
            bottomBtns.style.display = 'none';
            document.removeEventListener('keydown', handleKeyDown);
        });
    </script>
</body>

</html>
