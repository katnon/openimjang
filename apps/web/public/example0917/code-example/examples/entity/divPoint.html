<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Entity 그리기</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <link href="/static/css/app.css" rel="stylesheet">
    <script src="/lib/js/cesium/Cesium.js"></script>
    <link href="/lib/js/cesium/Widgets/widgets.css" rel="stylesheet">
    <script defer src="/lib/js/mapprime.cesium-controls.min.js"></script>
    <script defer src="/static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil1Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil2Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil3Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil4Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil5Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil6ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        .mapprime-black-panel {
            font-family: 'Daeojamjil';
        }
    </style>
</head>

<body>
    <div id="world-container"></div>
    <script>
        window.onload = () => {
            function createBlackPanelHtml(title) {
                return `
                <div class="mapprime-panel mapprime-black-panel animation-spaceInDown">
                    <div class="mapprime-black-panel-text">${title}</div>
                    <div class="mapprime-black-panel-pointer"></div>
                </div>
            `;
            }
            viewer._setCameraView({
                longitude: 127.107795,
                latitude: 37.5039,
                height: 1090,
                heading: 330,
                pitch: -38
            });
            viewer._createDivPoint({
                name: '롯데월드타워',
                position: [127.102616, 37.512469, 569],
                html: createBlackPanelHtml("롯데월드타워"),
                    maxVisibleDistance: 2000,
            });
            viewer._createDivPoint({
                name: 'LOTTE WORLD',
                position: [127.09983, 37.5114, 149.5],
                html: createBlackPanelHtml("LOTTE WORLD"),
            });
            viewer._createDivPoint({
                name: '롯데몰',
                position: [127.1041485615688, 37.513484265651954, 89],
                html: createBlackPanelHtml("롯데몰"),
            });
            viewer._createDivPoint({
                name: '롯데마트',
                position: [127.10533777304829, 37.513997982271725, 92],
                html: createBlackPanelHtml("롯데마트"),
            });
            viewer._createDivPoint({
                position: [127.09662915162652, 37.512921933279834, 60],
                html: `<div class="mapprime-panel mapprime-blue-apt-panel animation-spaceInDown">
                            <div class="mapprime-blue-apt-panel-b">
                                <span class="mapprime-blue-apt-type">아파트</span>
                                <span class="mapprime-blue-apt-num">11억</span>
                                <span class="mapprime-blue-apt-foot">2018년</span>
                                <span class="mapprime-blue-apt-etc">16평</span>
                            </div>
                        </div>`,
            });
            viewer._createDivPoint({
                name: '2',
                position: [127.0954600289319, 37.515727791261185, 60],
                html: `<div class="mapprime-panel mapprime-purple-apt-panel animation-spaceInDown">
                            <div class="mapprime-purple-apt-header">3,673만</div>
                            <div class="mapprime-purple-apt-body">
                                <div class="mapprime-purple-apt-title">매 12억</div>
                                <div class="mapprime-purple-apt-sub">108㎡</div>
                            </div>
                        </div>`
            });
            viewer._createDivPoint({
                name: '3',
                position: [127.10007720817606, 37.51884429698693, 61],
                html: `<div class="mapprime-panel mapprime-cornflower-apt-panel animation-spaceInDown">
                            <div class="mapprime-panel-info">
                                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
                                        <span style="font-size:16px;font-weight:bold;white-space:nowrap;">장미1차 아파트</span>
                                        <canvas id="sample-chart" style="width:70px;height:20px;"></canvas>
                                    </div>
                                    <span style="white-space: nowrap;font-size: 14px;text-align: left;width: 100%;color: #999;">서울 송파구 올림픽로35길 104</span>
                            </div>
                            <div class="mapprime-cornflower-apt-area">41평</div>
                            <div class="mapprime-cornflower-apt-price">24.5억</div>
                        </div>`
            });
            viewer._createDivPoint({
                name: '석촌호수',
                position: [127.10524338775704, 37.511272722373924, 8.5],
                html: `<div class="mapprime-spot">
                                <div class="mapprime-spot-board">
                                    <h5>석촌호수</h5>
                                </div>
                                <div class="mapprime-spot-line"></div>
                            </div>`,
                enableDistanceScale: true,

            });
            const ctx = document.getElementById('sample-chart');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ["", "", "", "", "", "", ""],
                    datasets: [{
                        data: [10, 11, 8, 10, 14, 16, 15],
                        borderColor: "rgb(89, 99, 217)",
                        backgroundColor: "rgba(89, 99, 217, 0.2)",
                        fill: true,
                        tension: 0.2,
                        pointRadius: 0
                    }]
                },
                options: {
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { display: false, min: 0, max: 20 }
                    }
                }
            });
        };
    </script>
</body>

</html>
