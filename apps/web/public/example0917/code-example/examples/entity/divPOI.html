<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Entity 그리기</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <link href="/static/css/app.css" rel="stylesheet">
    <script src="/lib/js/cesium/Cesium.js"></script>
    <link href="/lib/js/cesium/Widgets/widgets.css" rel="stylesheet">
    <script defer src="/lib/js/mapprime.cesium-controls.min.js"></script>
    <script defer src="/static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil1Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil2Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil3Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil4Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil5Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Daeojamjil';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302_01@1.0/TheJamsil6ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        .school:hover{
            color: #fff !important;
            transform-origin: center;
            scale: 1.1;
            transition: all .2s;
        }
    </style>
</head>

<body>
    <div id="world-container"></div>
    <button id="umd" style="background-color: rgb(255, 255, 255);position: absolute;top: 10px;left: 10px;color:#000;">읍면동 업데이트</button>
    <script>
        window.onload = () => {
            viewer._setCameraView({
                longitude: 127.107795,
                latitude: 37.5039,
                height: 1090,
                heading: 330,
                pitch: -38
            });
            document.getElementById('umd').addEventListener('click',()=>{
                fetch('/umd.json').then(res=>res.json()).then((res)=>{
                    viewer._updateDivPOI({
                        id:'dong',
                        data: res,
                        fontSize: 18,
                        color: 'rgba(200,10,10,.7)',
                    });
                });
            });
            fetch('/seoul.json').then(res=>res.json()).then((res)=>{
                viewer._createDivPOI({
                    id:'poi',
                    data: res,
                    maxVisibleDistance: 12000,
                    maxFeatures: 20,
                    pointerEvents: false,
                    icon: '/static/images/pin1.png',
                    iconSize: 25,
                    iconOrigin: 'left',
                    // template:`<div style="padding:5px;border: 1px solid #000;border-radius:5px;background-color:rgba(255,255,255,.7);">
                    //     <div>이름: {name}</div>
                    //     <div>경도: {lon}</div>
                    //     <div>위도: {lat}</div>
                    //     </div>`,
                });
            });
            fetch('/park.json').then(res=>res.json()).then((res)=>{
                viewer._createDivPOI({
                    id:'park',
                    data: res,
                    fontSize: 14,
                    color: '#bbf5a4',
                    maxVisibleDistance: 15000,
                    maxFeatures: 20,
                    pointerEvents: false,
                    zIndex: 10,
                    icon: '<svg stroke="#134400" fill="#134400" stroke-width="0" viewBox="0 0 384 512" height="200px" width="200px" xmlns="http://www.w3.org/2000/svg"><path d="M378.31 378.49L298.42 288h30.63c9.01 0 16.98-5 20.78-13.06 3.8-8.04 2.55-17.26-3.28-24.05L268.42 160h28.89c9.1 0 17.3-5.35 20.86-13.61 3.52-8.13 1.86-17.59-4.24-24.08L203.66 4.83c-6.03-6.45-17.28-6.45-23.32 0L70.06 122.31c-6.1 6.49-7.75 15.95-4.24 24.08C69.38 154.65 77.59 160 86.69 160h28.89l-78.14 90.91c-5.81 6.78-7.06 15.99-3.27 24.04C37.97 283 45.93 288 54.95 288h30.63L5.69 378.49c-6 6.79-7.36 16.09-3.56 24.26 3.75 8.05 12 13.25 21.01 13.25H160v24.45l-30.29 48.4c-5.32 10.64 2.42 23.16 14.31 23.16h95.96c11.89 0 19.63-12.52 14.31-23.16L224 440.45V416h136.86c9.01 0 17.26-5.2 21.01-13.25 3.8-8.17 2.44-17.47-3.56-24.26z"></path></svg>',
                });
            });
            fetch('/school.json').then(res=>res.json()).then((res)=>{
                viewer._createDivPOI({
                    id:'school',
                    color: '#88c9f2',
                    data: res,
                    maxVisibleDistance: 14000,
                    maxFeatures: 20,
                    pointerEvents: true,
                    zIndex: 9,
                    className:'school',
                    icon: '<svg stroke="#fff" fill="#fff" stroke-width="0" viewBox="0 0 512 512" height="200px" width="200px" xmlns="http://www.w3.org/2000/svg"><path d="M256 370.43 96 279v98.42l160 88.88 160-88.88V279l-160 91.43z"></path><path d="M512.25 192 256 45.57-.25 192 256 338.43l208-118.86V384h48V192.14l.25-.14z"></path></svg>'
                });
            });
            fetch('/sgg.json').then(res=>res.json()).then((res)=>{
                viewer._createDivPOI({
                    id:'dong',
                    data: res,
                    fontSize: 22,
                    color: '#fff',
                    maxVisibleDistance: 32000,
                    pointerEvents: false,
                    maxFeatures: 20,
                    opacity: .4
                });
            });
        };
    </script>
</body>

</html>
