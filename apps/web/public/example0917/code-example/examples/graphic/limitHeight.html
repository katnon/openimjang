<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고도제한 그래픽</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
    <link href="/static/css/app.css" rel="stylesheet">
    <script src="/lib/js/cesium/Cesium.js"></script>
    <link href="/lib/js/cesium/Widgets/widgets.css" rel="stylesheet">
    <script defer src="/lib/js/mapprime.cesium-controls.min.js"></script>
    <script defer src="/static/js/main.js"></script>
</head>

<body>
    <div id="form-wrap" class="form-wrap">
        <label>색상 <input type="text" value="rgba(255, 0, 0, 0.5)" id="color"></label>
        <label>고도제한 높이 <input type="range" value="60" id="height" min="0" max="600">
        <input type="number" value="60" id="height-text" style="width:40px;text-align: right;"></label>
    </div>
    <div id="world-container"></div>
    <script>
        window.onload = () => {
            let height = 60;
            const positions = [
                [127.09809, 37.51605],
                [127.10657, 37.51577],
                [127.10758, 37.51265],
                [127.10765, 37.50962],
                [127.10298, 37.50614],
                [127.09756, 37.50677],
                [127.09337, 37.51317],
                [127.09809, 37.51608]
            ];
            viewer._setCameraView({
                longitude: 127.106534,
                latitude: 37.50384,
                height: 820,
                heading: 330,
                pitch: -38
            });
            viewer._createLimitHeight({
                positions: positions,
                height: height
            });
            document.getElementById('height').addEventListener('input',(e)=>{
                const value = Number(e.target.value);
                viewer._updateLimitHeight({
                    height: value
                });
                document.getElementById('height-text').value = value;
            });
            document.getElementById('height-text').addEventListener('input',(e)=>{
                const value = Number(e.target.value);
                viewer._updateLimitHeight({
                    height: value
                });
                document.getElementById('height').value = value;
            });
            document.getElementById('color').addEventListener('input',(e)=>{
                viewer._updateLimitHeight({
                    color: e.target.value
                });
            });
        };
            
    </script>
</body>

</html>
